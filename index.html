<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050507">

  <title>Coka puni 20 · Disco Girl Party</title>
  <meta name="description" content="Pozivnica za Cokin 20. rođendan. Disco Girl Party, 26. novembar od 20:00.">

  <!-- Preview za WhatsApp / Viber / Instagram. Ako menjaš hosting, promeni URL-ove ispod. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coka puni 20 🪩 Disco Girl Party">
  <meta property="og:description" content="Četvrtak, 26. novembar od 20:00. Ti si pozvan/a!">
  <meta property="og:image" content="https://mmileticc.github.io/coka-rodj/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://mmileticc.github.io/coka-rodj/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Ako JS radi, intro ekran se prikazuje (bez JS-a stranica je odmah vidljiva) -->
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Pinyon+Script&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Pozadinski efekti -->
  <canvas id="glitter" aria-hidden="true"></canvas>
  <div id="reflections" aria-hidden="true"></div>

  <!-- ============ INTRO ============ -->
  <div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
    <div class="intro-inner text-center px-4">
      <div class="ball-wrap intro-wrap" aria-hidden="true">
        <canvas class="disco-ball intro-ball" width="160" height="160"></canvas>
      </div>
      <h1 id="intro-title" class="intro-title mt-4" data-text="intro.naslov"></h1>
      <p class="intro-sub" data-text="intro.podnaslov"></p>
      <button id="open-btn" type="button" class="btn btn-chrome btn-lg mt-3" data-text="intro.dugme"></button>
    </div>
  </div>
  <div id="flash" aria-hidden="true"></div>

  <main id="content">

    <!-- ============ HERO ============ -->
    <header class="hero text-center">
      <div class="ball-hanger">
        <span class="ball-string" aria-hidden="true"></span>
        <div class="ball-wrap hero-wrap">
          <canvas id="hero-ball" class="disco-ball" width="220" height="220"
                  title="Klikni me 🪩" role="button" aria-label="Disko kugla, klikni za disko režim" tabindex="0"></canvas>
        </div>
      </div>

      <p class="eyebrow mb-1" data-text="tema"></p>
      <h1 class="hero-name" data-text="ime"></h1>
      <p class="hero-puni mb-0">puni</p>
      <div class="hero-age chrome-text" data-text="godine"></div>
      <p class="hero-date mt-2">
        <span data-text="datumTekst"></span>
        <span class="dot">•</span>
        <span data-text="vremeTekst"></span>
      </p>
      <a href="#poruka" class="scroll-hint" aria-label="Skroluj dole"><span></span></a>
    </header>

    <!-- ============ COUNTDOWN ============ -->
    <section id="countdown" class="section reveal">
      <div class="container text-center">
        <h2 class="section-title" data-text="countdown.naslov"></h2>
        <div id="cd-boxes" class="row g-2 g-sm-3 justify-content-center">
          <div class="col-3 col-md-2"><div class="cd-box"><span id="cd-d" class="cd-num">--</span><span class="cd-label">dana</span></div></div>
          <div class="col-3 col-md-2"><div class="cd-box"><span id="cd-h" class="cd-num">--</span><span class="cd-label">sati</span></div></div>
          <div class="col-3 col-md-2"><div class="cd-box"><span id="cd-m" class="cd-num">--</span><span class="cd-label">min</span></div></div>
          <div class="col-3 col-md-2"><div class="cd-box"><span id="cd-s" class="cd-num">--</span><span class="cd-label">sek</span></div></div>
        </div>
        <p id="cd-done" class="cd-done d-none" data-text="countdown.poceloTekst"></p>
      </div>
    </section>

    <!-- ============ PORUKA ============ -->
    <section id="poruka" class="section">
      <div class="container">
        <div class="row align-items-center gx-4 gy-5">
          <div class="col-md-5 text-center reveal">
            <figure class="polaroid tilt-left mx-auto">
              <img id="slavljenica-img" alt="Coka" loading="lazy">
            </figure>
          </div>
          <div class="col-md-7 reveal">
            <h2 class="section-title text-md-start" data-text="poruka.naslov"></h2>
            <div id="poruka-tekst" class="poruka"></div>
            <p class="potpis" data-text="poruka.potpis"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ DETALJI ============ -->
    <section id="detalji" class="section">
      <div class="container">
        <h2 class="section-title text-center reveal">Detalji</h2>
        <div class="row g-3 g-md-4">
          <div class="col-md-4 reveal">
            <div class="glass-card h-100">
              <div class="card-icon" aria-hidden="true">📅</div>
              <h3>Kada</h3>
              <p class="mb-0"><span data-text="datumTekst"></span><br><span data-text="vremeTekst"></span></p>
            </div>
          </div>
          <div class="col-md-4 reveal">
            <div class="glass-card h-100">
              <div class="card-icon" aria-hidden="true">📍</div>
              <h3>Gde</h3>
              <p class="mb-0"><span data-text="lokacija.adresa"></span><br><span data-text="lokacija.deoGrada"></span></p>
            </div>
          </div>
          <div class="col-md-4 reveal">
            <div class="glass-card h-100">
              <div class="card-icon" aria-hidden="true">👗</div>
              <h3>Dress code</h3>
              <p class="mb-0" data-text="dressCode.naslov"></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ KAKO DOĆI ============ -->
    <section id="lokacija" class="section">
      <div class="container">
        <h2 class="section-title text-center reveal">Kako da stigneš</h2>
        <div class="row g-4 align-items-stretch">
          <div class="col-lg-5 reveal">
            <div class="glass-card h-100">
              <p class="address-big mb-1" data-text="lokacija.adresa"></p>
              <p class="text-silver mb-3" data-text="lokacija.deoGrada"></p>
              <ul id="uputstva" class="steps"></ul>
              <a id="maps-btn" class="btn btn-chrome mt-2" target="_blank" rel="noopener">Otvori u Google Maps</a>
            </div>
          </div>
          <div class="col-lg-7 reveal">
            <div class="map-wrap">
              <iframe id="map" title="Mapa lokacije žurke" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
            </div>
          </div>
        </div>
        <div id="ulaz-grid" class="row g-4 justify-content-center mt-2"></div>
      </div>
    </section>

    <!-- ============ OUTFIT INSPO ============ -->
    <section id="inspo" class="section">
      <div class="container text-center">
        <h2 class="section-title reveal">Outfit inspo</h2>
        <p class="lead-soft reveal" data-text="dressCode.opis"></p>
        <div id="tagovi" class="tags reveal"></div>
        <div id="inspo-grid" class="row g-3 g-md-4 justify-content-center mt-3"></div>
      </div>
    </section>

    <footer class="footer text-center">
      <p class="footer-big chrome-text" data-text="futer"></p>
      <p class="footer-small">Psst, klikni na disko kuglu na vrhu 😉</p>
    </footer>
  </main>

  <!-- Lightbox za slike -->
  <div class="modal fade" id="lightbox" tabindex="-1" aria-label="Uvećana slika" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content bg-transparent border-0">
        <button type="button" class="btn-close btn-close-white ms-auto mb-2" data-bs-dismiss="modal" aria-label="Zatvori"></button>
        <img id="lightbox-img" class="img-fluid rounded-3" alt="">
        <p id="lightbox-cap" class="text-center mt-2 mb-0"></p>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/disco-ball.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
